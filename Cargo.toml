[package]
name = "qshare-linux"
version = "0.2.0"
edition = "2021"
authors = ["Aditya <adityatr64>", "QuickShare Linux Contributors"]
description = "Native Libadwaita desktop client and receiver daemon for Google Quick Share"
repository = "https://github.com/adityatr64/QShare-linux"
license = "MIT"

[lib]
name = "qshare_linux"
path = "src/lib.rs"

[[bin]]
name = "QShare-linux"
path = "src/main.rs"

[dependencies]
# UI Toolkit
libadwaita = { version = "0.7", features = ["v1_4"] }
gtk4 = { version = "0.9", features = ["v4_6"] }
glib = "0.20"
gio = "0.20"
gdk-pixbuf = "0.20"


# Async runtime & networking
tokio = { version = "1", features = ["full"] }
mdns-sd = "0.21"

# Protobuf
prost = "0.13"
prost-types = "0.13"

# Cryptography & Security
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }

# Utilities
base64 = "0.22"
rand = "0.8"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
dirs = "5.0"
p256 = { version = "0.14.0", features = ["ecdh"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
prost-build = "0.13"
